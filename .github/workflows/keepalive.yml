name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ vars.KEEPALIVE_URL || 'https://life-court-api.onrender.com/api/health' }}
    steps:
      - name: GET /api/health (理쒕? 3?? 肄쒕뱶?ㅽ????湲??ы븿)
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -m 90 -o /tmp/health.json -w '%{http_code}' "$URL" || echo 000)
            echo "try $i ??HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json; echo
              # db_ok:false 硫?Supabase 履?臾몄젣 ???ㅽ뙣濡??쒖떆???뚮┝??媛寃??쒕떎
              grep -q '"db_ok":true' /tmp/health.json || { echo "::error::db_ok is not true"; exit 1; }
              exit 0
            fi
            sleep 20
          done
          echo "::error::health check failed: $URL"
          exit 1

